document.addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}
 if(e.key==='ArrowRight'){e.preventDefault();move(1)}
 if(e.code==='Space'&&!running)startGame();
});
left.onpointerdown=()=>move(-1);right.onpointerdown=()=>move(1);

function hit(a,b){
 const A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
 return A.left<B.right-12&&A.right>B.left+12&&A.top<B.bottom-12&&A.bottom>B.top+12;
}
function spawn(){
 if(!running||paused)return;
 const type=types[Math.floor(Math.random()*types.length)];
 const el=document.createElement('div');el.className='obstacle '+type;
 el.style.left=(5+Math.random()*88)+'%';el.style.top='-70px';
 pf.appendChild(el);obs.push({el,y:-70,speed:190+Math.random()*125,kind:'obstacle'});
}
function spawnBonus(){
 if(!running||paused)return;
 const isLife=Math.random()<0.3; // 30% 하트(생명), 70% 거품(+5점)
 const el=document.createElement('div');el.className='bonus '+(isLife?'life':'coin');
 el.style.left=(5+Math.random()*88)+'%';el.style.top='-60px';
 pf.appendChild(el);obs.push({el,y:-60,speed:170+Math.random()*90,kind:isLife?'life':'coin'});
}
function loop(now){
 if(!running)return;const dt=Math.min((now-last)/1000,.04);last=now;
 if(!paused){
  for(let i=obs.length-1;i>=0;i--){
   const o=obs[i];o.y+=o.speed*dt;o.el.style.top=o.y+'px';
   if(hit(o.el,player)){
    o.el.remove();obs.splice(i,1);lives--;lifeEl.textContent=lives;
    player.animate([{transform:'translateX(-50%) scale(1)'},{transform:'translateX(-50%) scale(1.18)'},{transform:'translateX(-50%) scale(1)'}],{duration:220});
    if(lives<=0){endGame();return}
   } else if(o.y>pf.clientHeight-55){
    o.el.remove();obs.splice(i,1);score++;scoreEl.textContent='점수 '+score;
   }
  }
 }
 raf=requestAnimationFrame(loop);
}
function startGame(){
 obs.forEach(o=>o.el.remove());obs=[];x=50;score=0;lives=3;time=30;paused=false;setX();
 scoreEl.textContent='점수 0';lifeEl.textContent='3';timeEl.textContent='30';
 start.classList.add('hidden');over.classList.add('hidden');pauseBtn.classList.remove('hidden');
 running=true;last=performance.now();spawnTimer=setInterval(spawn,600);
 tickTimer=setInterval(()=>{if(!paused){time--;timeEl.textContent=time;if(time<=0)endGame()}},1000);
 raf=requestAnimationFrame(loop);
}
function endGame(){
 if(!running)return;running=false;paused=false;clearInterval(spawnTimer);clearInterval(tickTimer);cancelAnimationFrame(raf);
 obs.forEach(o=>o.el.remove());obs=[];pauseBtn.classList.add('hidden');final.textContent=score;
 if(score>best){best=score;localStorage.setItem('pigBest',best);bestEl.textContent=best}
 over.classList.remove('hidden');
}
pauseBtn.onclick=()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?'▶':'Ⅱ'};
startBtn.onclick=startGame;restartBtn.onclick=startGame;
</script>
</body></html>
